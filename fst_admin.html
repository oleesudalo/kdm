<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>축제 관리자 대시보드</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .hide { display: none !important; }
    /* 애니메이션용 트랜지션 클래스 추가 */
    .progress-bar { transition: width 1s ease-out, background-color 1s ease-out; }
    .animating-bar { transition: width 0.075s linear; } 
  </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center font-sans selection:bg-pink-500/30 p-4 text-white">

  <!-- 16:9 가로 비율 (TV/스크린용) 컨테이너 -->
  <div class="w-full max-w-[1920px] aspect-video bg-gray-900 flex flex-col relative overflow-hidden shadow-2xl rounded-xl">
    
    <!-- 상단 뷰 전환 네비게이션 (팀 관리 메뉴 삭제 후 대시보드 고정) -->
    <div class="bg-gray-950/80 backdrop-blur-lg border-b border-gray-800 p-3 flex justify-center gap-4 z-50 shrink-0">
      <div class="flex items-center gap-2 px-6 py-2.5 rounded-full font-bold transition-all bg-indigo-600 text-white shadow-lg cursor-default">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i> 실시간 대시보드
      </div>
    </div>
    
    <div class="flex-1 p-4 md:p-8 lg:p-10 overflow-hidden flex flex-col relative">
      
      <!-- 1. 대시보드 뷰 -->
      <div id="view-dashboard" class="max-w-7xl w-full mx-auto h-full flex flex-col justify-center animate-[fadeIn_0.5s_ease-out]">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8 bg-gray-800/50 p-6 rounded-3xl border border-gray-700/50 shadow-xl backdrop-blur-md shrink-0">
          <div>
            <h1 class="text-3xl font-bold flex items-center gap-3 mb-2">
              <i data-lucide="presentation" class="text-indigo-400 w-8 h-8"></i> 
              축제 노래자랑 관리자 센터
            </h1>
            <p class="text-gray-400">실시간 투표 현황 및 통계</p>
          </div>
          <div class="flex items-center gap-4">
            <!-- 초기화 버튼 -->
            <button onclick="window.openResetModal()" class="flex items-center justify-center gap-2 px-5 py-3 bg-red-500/10 text-red-400 border border-red-500/30 rounded-xl hover:bg-red-500/20 transition-colors font-bold whitespace-nowrap">
              <i data-lucide="rotate-ccw" class="w-5 h-5"></i> 전체 투표 초기화
            </button>
            <div class="flex items-center gap-6 bg-gray-900/50 px-6 py-4 rounded-2xl border border-gray-700">
              <div class="flex items-center gap-3">
                <i data-lucide="users" class="text-blue-400 w-7 h-7"></i>
                <div>
                  <p class="text-sm text-gray-400">총 투표수</p>
                  <p id="total-votes" class="text-2xl font-black text-white tabular-nums">0</p>
                </div>
              </div>
            </div>
          </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1 items-center" id="dash-grids">
          <!-- JS로 각 학년별 현황 렌더링 -->
        </div>
      </div>
    </div>
  </div>

  <!-- 전체 투표 초기화 확인 모달 -->
  <div id="reset-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] flex items-center justify-center hide opacity-0 transition-opacity duration-300">
    <div class="bg-gray-900 border border-gray-700 p-8 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300" id="reset-modal-content">
      <h3 class="text-2xl font-bold mb-4 text-white text-center">전체 투표 초기화</h3>
      <p class="text-gray-400 mb-6 text-center">정말로 모든 투표를 <span class="text-pink-500 font-bold">0표</span>로 초기화하시겠습니까?<br>이 작업은 되돌릴 수 없습니다.</p>
      <div class="flex gap-3">
        <button onclick="window.closeResetModal()" class="flex-1 py-3 rounded-xl font-bold bg-gray-800 text-gray-300 hover:bg-gray-700 transition-colors">취소</button>
        <button onclick="window.executeResetVotes()" class="flex-1 py-3 rounded-xl font-bold bg-pink-600 text-white hover:bg-pink-500 transition-colors">초기화</button>
      </div>
    </div>
  </div>

  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    // 변경된 부분: collection과 writeBatch를 추가로 불러옵니다.
    import { getFirestore, doc, setDoc, onSnapshot, collection, writeBatch } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAY8k0s6omcvuJ1gxuGhGdRQ58qx8UHkPc",
      authDomain: "dm-fst-ctst.firebaseapp.com",
      projectId: "dm-fst-ctst",
      storageBucket: "dm-fst-ctst.firebasestorage.app",
      messagingSenderId: "196762863805",
      appId: "1:196762863805:web:5c070363226806e03c8fd4"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const artifactAppId = typeof __app_id !== 'undefined' ? __app_id : 'festival-voting-app';

    // 기본 투표수를 0으로 설정 및 팀명 영구 고정(하드코딩)
    const INITIAL_TEAMS_DATA = {
      1: [
        { id: '1-1', name: '이무진', song: '청춘만화', votes: 0 },
        { id: '1-2', name: '이무진', song: '눈이 오잖아', votes: 0 },
        { id: '1-3', name: '다비치', song: '8282', votes: 0 },
      ],
      2: [
        { id: '2-1', name: '윤하', song: '비밀번호 486', votes: 0 },
        { id: '2-2', name: '안예은', song: '낮에 뜨는 달', votes: 0 },
        { id: '2-3', name: '이찬원', song: '진또배기', votes: 0 },
      ],
      3: [
        { id: '3-1', name: '더 크로스', song: '당신을 위하여', votes: 0 },
        { id: '3-2', name: '소찬휘', song: 'Tears', votes: 0 },
        { id: '3-3', name: '아이유', song: '아이와 나의 바다', votes: 0 },
      ]
    };

    // 불필요해진 상태 변수 삭제 및 정리
    let voteCounts = {};
    let votingStatus = { 1: false, 2: false, 3: false }; 

    // --- UI 조작 및 글로벌 함수 ---
    window.openResetModal = () => {
      const modal = document.getElementById('reset-modal');
      modal.classList.remove('hide');
      void modal.offsetWidth;
      modal.classList.remove('opacity-0');
      document.getElementById('reset-modal-content').classList.remove('scale-95');
    };

    window.closeResetModal = () => {
      const modal = document.getElementById('reset-modal');
      modal.classList.add('opacity-0');
      document.getElementById('reset-modal-content').classList.add('scale-95');
      setTimeout(() => modal.classList.add('hide'), 300);
    };

    window.executeResetVotes = async () => {
      // 변경된 부분: 분산된 투표함(9개)을 모두 0으로 초기화 (writeBatch 사용)
      const batch = writeBatch(db);
      Object.values(INITIAL_TEAMS_DATA).flat().forEach(t => {
        const teamRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'vote_results', t.id);
        batch.set(teamRef, { votes: 0 });
      });
      await batch.commit(); 
      
      const newSessionId = "session_" + Date.now();
      const statusRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'voting_status', 'grades');
      await setDoc(statusRef, { 1: false, 2: false, 3: false, sessionId: newSessionId });

      window.closeResetModal();
      lucide.createIcons();
    };

    // 투표 시작/마감 토글 함수
    window.toggleVoting = async (grade) => {
      const newStatus = !votingStatus[grade];
      const statusRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'voting_status', 'grades');
      await setDoc(statusRef, { [grade]: newStatus }, { merge: true });
    };

    // --- 데이터 처리 ---
    function getTeamsData() {
      const data = { 1: [], 2: [], 3: [] };
      [1, 2, 3].forEach(grade => {
        // 하드코딩된 데이터만 참조하도록 변경
        data[grade] = INITIAL_TEAMS_DATA[grade].map(team => ({
          ...team,
          votes: voteCounts[team.id] !== undefined ? voteCounts[team.id] : (team.votes || 0)
        }));
      });
      return data;
    }

    function getTotalVotes() {
      let total = 0;
      const data = getTeamsData();
      Object.values(data).forEach(grade => {
        grade.forEach(team => { total += team.votes; });
      });
      return total;
    }

    // --- 렌더링 함수 ---
    function render() {
      renderDashboard();
      // 기존에 여기 있던 lucide.createIcons(); 는 아래로 이동합니다.
    }

    function renderDashboard() {
      document.getElementById('total-votes').textContent = getTotalVotes().toLocaleString();
      const grids = document.getElementById('dash-grids');
      const data = getTeamsData();

      grids.innerHTML = [1, 2, 3].map(grade => {
        const teams = [...data[grade]].sort((a, b) => b.votes - a.votes);
        const maxVotes = teams[0].votes || 1;

        const teamRows = teams.map((team, index) => {
          const isFirst = index === 0;
          const percentage = (team.votes / maxVotes) * 100;
          
          return `
            <div class="relative">
              <div class="flex justify-between items-end mb-2">
                <div class="flex items-center gap-2 truncate pr-4">
                  ${isFirst ? '<i data-lucide="trophy" class="text-yellow-400 w-[18px] h-[18px] shrink-0"></i>' : ''}
                  <span class="font-bold truncate ${isFirst ? 'text-yellow-400 text-lg' : 'text-gray-200'}">
                    ${team.name} <span class="text-sm font-normal ${isFirst ? 'text-yellow-200/80' : 'text-gray-400'} ml-1">- ${team.song}</span>
                  </span>
                </div>
                <span class="font-black tabular-nums shrink-0">${team.votes}표</span>
              </div>
              <div class="h-3 w-full bg-gray-900 rounded-full overflow-hidden">
                <div class="h-full rounded-full transition-all duration-1000 ${isFirst ? 'bg-gradient-to-r from-yellow-500 to-yellow-300 shadow-[0_0_10px_rgba(253,224,71,0.5)]' : 'bg-indigo-500'}" style="width: ${percentage}%"></div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="bg-gray-800/40 rounded-3xl p-6 border border-gray-700/50 backdrop-blur-sm">
            <h2 class="text-2xl font-bold mb-6 pb-4 border-b border-gray-700 flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="bg-indigo-500/20 text-indigo-300 w-8 h-8 rounded-full flex items-center justify-center text-sm">${grade}</span>
                학년 투표 현황
              </div>
              <button onclick="window.toggleVoting(${grade})" class="px-4 py-2 rounded-xl text-sm font-bold transition-all flex items-center gap-2 ${votingStatus[grade] ? 'bg-pink-600 hover:bg-pink-500 text-white shadow-[0_0_15px_rgba(236,72,153,0.5)]' : 'bg-gray-700 hover:bg-gray-600 text-gray-300'}">
                <i data-lucide="${votingStatus[grade] ? 'pause-circle' : 'play-circle'}" class="w-4 h-4"></i>
                ${votingStatus[grade] ? '진행 중 (마감하기)' : '투표 시작'}
              </button>
            </h2>
            <div class="space-y-8 mt-2">
              ${teamRows}
            </div>
          </div>
        `;
      }).join('');

      // 화면을 다시 그릴 때마다 항상 아이콘을 다시 생성하도록 끝에 추가합니다!
      lucide.createIcons();
    }

    // --- 앱 초기화 ---
    async function initApp() {
      lucide.createIcons();
      render();

      try {
        await signInAnonymously(auth);
      } catch (err) {
        console.error("Auth Error", err);
      }

      // 변경된 부분: 9개로 쪼개진 팀별 투표함을 실시간으로 긁어모음
      const colRef = collection(db, 'artifacts', artifactAppId, 'public', 'data', 'vote_results');
      onSnapshot(colRef, (snap) => {
        if (!snap.empty) {
          snap.docs.forEach(doc => {
            voteCounts[doc.id] = doc.data().votes || 0;
          });
          renderDashboard(); // 대시보드 실시간 즉각 반영
        } else {
          // 최초 데이터 세팅 (9개로 분산)
          const batch = writeBatch(db);
          Object.values(INITIAL_TEAMS_DATA).flat().forEach(t => { 
            const teamRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'vote_results', t.id);
            batch.set(teamRef, { votes: 0 });
            voteCounts[t.id] = 0;
          });
          batch.commit();
        }
      }, (err) => console.error("Snapshot error:", err));
      
      // 투표 진행 상태 구독 (팀 정보 구독은 삭제됨)
      const statusRef = doc(db, 'artifacts', artifactAppId, 'public', 'data', 'voting_status', 'grades');
      onSnapshot(statusRef, (snap) => {
        if (snap.exists()) {
          votingStatus = snap.data();
        } else {
          setDoc(statusRef, { 1: false, 2: false, 3: false, sessionId: 'default' });
          votingStatus = { 1: false, 2: false, 3: false };
        }
        renderDashboard();
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);

  </script>
</body>
</html>
